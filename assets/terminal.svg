<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-label="Animated training terminal">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f4f6"/><stop offset="1" stop-color="#8f949c"/>
    </linearGradient>
    <linearGradient id="holo" x1="-1" y1="0" x2="0" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#ff6ec7"/><stop offset="0.5" stop-color="#6ef3ff"/><stop offset="1" stop-color="#b69cff"/>
      <animate attributeName="x1" values="-1;1" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="c1"><rect x="20" y="48" height="24" width="0"><animate attributeName="width" values="0;0;680;680;0" keyTimes="0;0.02;0.12;0.95;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c2"><rect x="20" y="74" height="24" width="0"><animate attributeName="width" values="0;0;680;680;0" keyTimes="0;0.15;0.25;0.95;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c3"><rect x="20" y="100" height="24" width="0"><animate attributeName="width" values="0;0;680;680;0" keyTimes="0;0.28;0.38;0.95;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c4"><rect x="20" y="126" height="24" width="0"><animate attributeName="width" values="0;0;680;680;0" keyTimes="0;0.41;0.51;0.95;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c5"><rect x="20" y="222" height="24" width="0"><animate attributeName="width" values="0;0;680;680;0" keyTimes="0;0.82;0.9;0.95;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <!-- holo drop shadow + window -->
  <rect x="16" y="16" width="780" height="280" fill="url(#holo)" opacity="0.8"/>
  <rect x="6" y="6" width="780" height="280" fill="#07070a" stroke="#c9ccd1" stroke-width="2"/>
  <rect x="6" y="6" width="780" height="30" fill="url(#bar)"/>
  <text x="20" y="26" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#111" letter-spacing="2">NEURAL_NET.EXE</text>
  <g fill="#d9dce1" stroke="#6b6f78">
    <rect x="722" y="13" width="16" height="16"/><rect x="742" y="13" width="16" height="16"/><rect x="762" y="13" width="16" height="16"/>
  </g>
  <g font-family="Courier New, monospace" font-size="12" font-weight="bold" fill="#111" text-anchor="middle">
    <text x="730" y="26">_</text><text x="750" y="26">□</text><text x="770" y="26">×</text>
  </g>

  <g font-family="Courier New, monospace" font-size="15">
    <g clip-path="url(#c1)"><text x="26" y="66"><tspan fill="#6ef3ff">&gt; </tspan><tspan fill="#e6e8eb">python train.py --epochs 100</tspan></text></g>
    <g clip-path="url(#c2)"><text x="26" y="92" fill="#c9ccd1">epoch 001/100   loss 1.0986   acc 0.3341</text></g>
    <g clip-path="url(#c3)"><text x="26" y="118" fill="#c9ccd1">epoch 050/100   loss 0.2214   acc 0.9012</text></g>
    <g clip-path="url(#c4)"><text x="26" y="144" fill="#c9ccd1">epoch 100/100   loss 0.0412   acc 0.9871</text></g>

    <text x="26" y="180" fill="#ff6ec7" letter-spacing="3">TRAINING</text>
    <rect x="26" y="190" width="520" height="18" fill="none" stroke="#c9ccd1"/>
    <rect x="28" y="192" height="14" width="0" fill="url(#holo)">
      <animate attributeName="width" values="0;0;516;516;0" keyTimes="0;0.5;0.8;0.95;1" dur="12s" repeatCount="indefinite"/>
    </rect>

    <g clip-path="url(#c5)"><text x="26" y="240"><tspan fill="#6ef3ff">✓ </tspan><tspan fill="#e6e8eb">MODEL SAVED → models/classifier.h5</tspan></text></g>
    <rect x="26" y="254" width="9" height="16" fill="#c9ccd1"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
  </g>
</svg>